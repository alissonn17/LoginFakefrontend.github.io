<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <script type="module" src="../scripts/scriptCadastrar.js"></script>

    <title>LoginFake</title>
</head>
<body>
    <section class="cadastrar-container">
        <h1>Cadastrar</h1>
        <form id="cadastrar-form" novalidate>
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required>

            <label for="birthdate">Data de Nascimento:</label>
            <input type="date" id="birthdate" name="birthdate" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="cellphone">Celular:</label>
            <input type="tel" id="cellphone" name="cellphone" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>

            <label for="password2">Confirme a Senha:</label>
            <input type="password" id="password2" name="password2" required>

            <button id="cadastrar-button" type="submit">Cadastrar</button>
            <button id="login-button" type="button"><a href="../index.html">Login</a></button>
            <p id="cadastro-message" role="status" aria-live="polite"></p>
        </form>
    </section>
</body>
</html>
